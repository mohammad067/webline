name: Gitleaks

on:
  push:
  pull_request:

jobs:
  scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    env:
      # Ensure compatibility with GitHub runners
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@70df8ecbe5876352c803360b05b38a4d46890479 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
